<div class="planilha-grid">
  <article class="sheet-card" *ngFor="let sheet of sheets; let i = index">
    <header class="sheet-card-header">
      <div class="sheet-card-title">
        <span class="sheet-badge"> {{ sheet.name }} </span>
      </div>

      <div class="sheet-actions">
        <button type="button" class="btn btn-primary" (click)="addRow(sheet)">
          <span class="btn-icon">＋</span> Item
        </button>
        <button type="button" class="btn btn-ghost" (click)="deleteRow(sheet)">
          <span class="btn-icon">－</span> Item
        </button>
        <button
          type="button"
          class="btn btn-primary"
          (click)="openNewCategoryModal(i)"
        >
          <span class="btn-icon">＋</span> Categoria
        </button>
        <button
          type="button"
          class="btn btn-danger"
          (click)="deleteCategory(sheet)"
        >
          <span class="btn-icon">×</span> Categoria
        </button>
      </div>
    </header>

    <div class="sheet-grid-wrapper">
      <ag-grid-angular
        class="ag-theme-alpine"
        style="width: 100%; height: 420px"
        [columnDefs]="sheet.categoryDefs"
        [rowData]="sheet.rowData"
      >
      </ag-grid-angular>
    </div>
  </article>
</div>

<div
  *ngIf="isNewCategoryModalOpen"
  class="new-column-modal-backdrop"
  (click)="closeNewCategoryModal()"
>
  <div
    class="new-column-modal"
    (click)="$event.stopPropagation()"
    role="dialog"
    aria-modal="true"
  >
    <header class="modal-header">
      <h2>Nova Categoria</h2>
      <button
        class="modal-close"
        (click)="closeNewCategoryModal()"
        aria-label="Fechar"
      >
        ×
      </button>
    </header>

    <p class="modal-sheet-name">
      Adicionar categoria em
      <strong>{{ sheets[selectedSheetIndex].name }}</strong>
    </p>

    <label class="modal-label">
      <span>Tipo de categoria</span>
      <select [(ngModel)]="newCategoryName" autofocus>
        <option value="" disabled>Selecione um tipo</option>
        <option *ngFor="let option of categoryOptions" [value]="option">
          {{ option }}
        </option>
      </select>
    </label>

    <p class="modal-error" *ngIf="newCategoryError">{{ newCategoryError }}</p>

    <div class="modal-actions">
      <button
        type="button"
        class="btn btn-ghost"
        (click)="closeNewCategoryModal()"
      >
        Cancelar
      </button>
      <button
        type="button"
        class="btn btn-primary"
        (click)="confirmNewCategory()"
        [disabled]="!newCategoryName"
      >
        Adicionar
      </button>
    </div>
  </div>
</div>
